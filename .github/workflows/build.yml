name: Build LineageOS 19 - ginkgo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS branch"
        required: true
        default: "lineage-19.0"

env:
  DEVICE: ginkgo
  BUILD_DIR: /srv/android/lineage

jobs:
  build:
    runs-on: [self-hosted, linux, x64, android-builder]
    timeout-minutes: 600

    steps:
      - name: Check resources
        run: |
          echo "=== CPU ===" && nproc
          echo "=== RAM ===" && free -h
          echo "=== Disk ===" && df -h /srv

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs curl wget rsync \
            openjdk-17-jdk \
            ccache schedtool \
            python3 python3-pip \
            libssl-dev libxml2-dev libxslt1-dev \
            zlib1g-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo 'export PATH=~/bin:$PATH' >> ~/.bashrc
          source ~/.bashrc

      - name: Configure git
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"
          git lfs install

      - name: Initialize repo
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          repo init -u https://github.com/LineageOS/android.git \
                    -b ${{ github.event.inputs.branch }} \
                    --git-lfs --no-clone-bundle

      - name: Add device manifest
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/device.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="LineageOS"
                    fetch="https://github.com/LineageOS"
                    review="code.lineageos.org" />
            <project path="device/xiaomi/ginkgo"
                     name="android_device_xiaomi_ginkgo"
                     remote="LineageOS"
                     revision="${{ github.event.inputs.branch }}" />
            <project path="kernel/xiaomi/sm6125"
                     name="android_kernel_xiaomi_sm6125"
                     remote="LineageOS"
                     revision="${{ github.event.inputs.branch }}" />
            <project path="vendor/xiaomi/ginkgo"
                     name="proprietary_vendor_xiaomi_ginkgo"
                     remote="LineageOS"
                     revision="${{ github.event.inputs.branch }}" />
          </manifest>
          EOF

      - name: Sync sources
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --force-sync -j$(nproc)
          repo start --branch ${{ github.event.inputs.branch }} --all

      - name: Enable ccache
        run: ccache -M 100G

      - name: Build
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          source build/envsetup.sh
          breakfast ${{ env.DEVICE }}
          croot
          brunch ${{ env.DEVICE }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.0-ginkgo
          path: |
            ${{ env.BUILD_DIR }}/out/target/product/ginkgo/lineage-19.0-*-UNOFFICIAL-ginkgo.zip
            ${{ env.BUILD_DIR }}/out/target/product/ginkgo/recovery.img
          retention-days: 7

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-19.0-ginkgo-${{ github.run_number }}
          files: |
            ${{ env.BUILD_DIR }}/out/target/product/ginkgo/lineage-19.0-*-UNOFFICIAL-ginkgo.zip
            ${{ env.BUILD_DIR }}/out/target/product/ginkgo/recovery.img   
